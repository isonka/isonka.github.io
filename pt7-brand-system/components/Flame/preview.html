<!doctype html>
<html>
<head><meta charset="utf-8"><title>Flame — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);}
  .row{display:flex;align-items:flex-end;gap:var(--space-12);padding:var(--space-8) var(--space-12);}
  .f-c{fill:var(--gold);} .f-s{fill:var(--track);} .bowl{fill:var(--ink);}
  .blades path{stroke:var(--ground);stroke-width:5;stroke-linejoin:round;paint-order:stroke;}
  .solo .f-c,.solo .f-s,.solo .bowl{fill:var(--gold-text);}
  .lock{display:flex;align-items:flex-end;gap:var(--space-2);}
  .word{font-family:var(--font-display);font-weight:900;font-size:88px;line-height:.78;letter-spacing:-.02em;color:var(--ink);}
  .cap{font-family:var(--font-sans);font-weight:500;font-size:13px;color:var(--ink-muted);margin-top:var(--space-3);}
</style></head>
<body>
<div class="row">
  <div>
    <svg width="104" height="148" viewBox="0 0 100 142" aria-label="PT7 flame">
      <g class="blades"><path class="f-c" d="M36 122C30 84 50 46 72 0C66 42 80 80 72 122Z"/><path class="f-s" d="M18 122C12 98 22 72 38 44C38 76 50 100 48 122Z"/><path class="f-s" d="M60 122C58 102 72 88 90 60C92 90 88 108 82 122Z"/></g>
      <polygon class="bowl" points="8,126 96,126 84,142 20,142"/>
    </svg>
    <div class="cap">Full colour</div>
  </div>
  <div class="solo">
    <svg width="104" height="148" viewBox="0 0 100 142" aria-label="PT7 flame, one colour">
      <g class="blades"><path class="f-c" d="M36 122C30 84 50 46 72 0C66 42 80 80 72 122Z"/><path class="f-s" d="M18 122C12 98 22 72 38 44C38 76 50 100 48 122Z"/><path class="f-s" d="M60 122C58 102 72 88 90 60C92 90 88 108 82 122Z"/></g>
      <polygon class="bowl" points="8,126 96,126 84,142 20,142"/>
    </svg>
    <div class="cap">One colour</div>
  </div>
</div>
</body>
</html>
