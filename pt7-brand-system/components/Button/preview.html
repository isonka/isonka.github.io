<!doctype html>
<html><head><meta charset="utf-8"><title>Button — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
  body{margin:0;background:var(--ground);font-family:var(--font-sans);}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;padding:var(--space-8);}
  .btn{font:500 15px/20px var(--font-sans);border:0;border-radius:var(--radius-0);padding:15px 28px;cursor:pointer;}
  .primary{background:var(--gold);color:var(--on-accent);} .primary:hover{background:var(--gold-deep);}
  .outline{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .dark{background:var(--ink);color:var(--ground);padding:12px 22px;}
  .btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;}
</style></head>
<body><div class="row">
  <button class="btn primary">Book your first class</button>
  <button class="btn outline">Explore classes</button>
  <button class="btn dark">Book a class</button>
</div></body></html>
