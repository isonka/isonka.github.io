<!doctype html>
<html><head><meta charset="utf-8"><title>Hero — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<style>
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);}
  .hero{display:flex;align-items:center;gap:32px;padding:48px;height:460px;box-sizing:border-box;}
  .copy{flex:1 1 0;}
  .eyebrow{font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--gold-text);}
  h1{margin:16px 0 0;font-weight:300;font-size:64px;line-height:1.02;letter-spacing:-.03em;} h1 b{font-weight:500;}
  p{margin:20px 0 0;max-width:380px;font-size:16px;line-height:26px;color:var(--ink-muted);}
  .ctas{margin-top:28px;display:flex;gap:12px;}
  .btn{font:500 15px/20px var(--font-sans);padding:14px 24px;border:0;} .primary{background:var(--gold);color:var(--on-accent);} .outline{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .art{flex:0 0 360px;height:360px;} .lane7{fill:var(--gold);} .lanes path{fill:none;stroke:var(--line);stroke-width:1.5;} .num{fill:var(--ink-muted);} .num7{fill:var(--ink);}
</style></head>
<body><div class="hero">
  <div class="copy">
    <div class="eyebrow">Pilates · Yoga · Strength — Olympisch Stadion, Amsterdam</div>
    <h1>Find your <b>lane.</b></h1>
    <p>Seven ways to train, one coach beside you. Small classes of up to ten.</p>
    <div class="ctas"><button class="btn primary">Book your first class</button><button class="btn outline">Explore classes</button></div>
  </div>

</div></body></html>
