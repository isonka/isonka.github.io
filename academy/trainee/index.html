<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The PT7 Academy trainee area (academy.pt7.nl): its own page and build, outside the site's single-page app, so
      none of the site's third-party scripts (Google Tag Manager, Mindbody, the chatbot) are loaded or published with
      it (owner, 2026-11-18 and 2026-11-21; pt7-academy docs/DECISIONS_LOG.md).
      The build adds a strict Content-Security-Policy here (vite.trainee.config.ts).
      Not indexed, not in the sitemap, English only.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <title>Trainee area | PT7 Academy</title>
    <meta name="description" content="Sign in to the PT7 Academy trainee area." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  </head>
  <body>
    <div id="root">
      <header class="trainee-top"><a href="https://pt7.nl/" class="trainee-brand">PT7</a></header>
      <main class="trainee"><div class="trainee-inner"><p class="kicker">PT7 Academy</p><h1>Trainee area</h1><p>Loading…</p></div></main>
    </div>
    <noscript>The trainee area needs JavaScript.</noscript>
    <script type="module" src="../../src/trainee/main.tsx"></script>
  </body>
</html>
