name: Weekly SEO agent

# Collect Search Console + GA4 → snapshot the live site → evaluate past changes
# → let Claude carry out the budgeted plan → verify → open a PR for review.
# History (daily data, snapshots, reports, proposals) lives on the `seo-data`
# branch, so main only ever changes through reviewed PRs.
#
# Three jobs, so the job where Claude reads outside data and runs the build never holds a write token:
#   collect  data, snapshot, evaluation, the site content (build key); pushes the history to seo-data. No agent here.
#   propose  Claude, lint, build, verify. Read-only token, not kept on disk; no secret but Claude's own token. Hands
#            over the patch and the two proposal files as size-capped job outputs (never an artifact: unpacking a zip
#            the agent's job could have shaped is not safe in a job with a write token).
#   open-pr  write token; never installs or runs this repository's code. Takes the patch only if it modifies existing
#            files the agent may change (scripts/seo-agent/config.js, editableFiles): no new, deleted or renamed files,
#            no mode changes, nothing binary. Saves the proposal to seo-data and opens the PR.
# No job here restores or saves a cache: propose runs agent-edited code on main's cache scope, and the deploy workflow
# restores nothing from it either.

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: 'Let Claude edit the site and open a PR (off = report only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the first run backfills 120 days
    permissions:
      contents: write # push the history to seo-data
    env:
      SEO_DATA_DIR: .seo-data
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
    outputs:
      run-date: ${{ steps.date.outputs.run-date }}
      actions: ${{ steps.evaluate.outputs.actions }}
      seo-data-sha: ${{ steps.save.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check out history branch
        id: date
        run: |
          git config user.name "pt7-seo-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin seo-data:refs/remotes/origin/seo-data 2>/dev/null; then
            git worktree add -B seo-data .seo-data origin/seo-data
          else
            git worktree add --orphan -b seo-data .seo-data
          fi
          RUN_DATE="$(date -u +%F)"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "run-date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Collect Search Console + GA4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run seo:collect

      - name: Snapshot live site
        run: npm run seo:snapshot

      - name: Evaluate
        id: evaluate
        run: |
          npm run seo:evaluate
          cat .seo-data/reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          echo "actions=$(node -p 'require("./.seo-data/reports/latest.json").actions.length')" >> "$GITHUB_OUTPUT"

      - name: Save history
        id: save
        working-directory: .seo-data
        run: |
          git add -A
          git diff --cached --quiet || git commit -q -m "data: $RUN_DATE"
          git push -q origin seo-data
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The site's content from the PT7 Academy API, here so the build key never enters the job the agent runs in
      - name: Fetch site content
        if: steps.evaluate.outputs.actions != '0' && github.event.inputs.apply != 'false'
        env:
          SITE_BUILD_KEY: ${{ secrets.SITE_BUILD_KEY }}
        run: npm run content

      - name: Hand over the site content
        if: steps.evaluate.outputs.actions != '0' && github.event.inputs.apply != 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-content
          path: |
            src/data/generated
            .site-content
          include-hidden-files: true # .site-content/
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: collect
    if: needs.collect.outputs.actions != '0' && github.event.inputs.apply != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SEO_DATA_DIR: .seo-data
      RUN_DATE: ${{ needs.collect.outputs.run-date }}
    outputs:
      patch: ${{ steps.handover.outputs.patch }}
      proposal-json: ${{ steps.handover.outputs.proposal-json }}
      proposal-md: ${{ steps.handover.outputs.proposal-md }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the agent reads git history for content regressions
          persist-credentials: false

      - name: Check out this run's history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.collect.outputs.seo-data-sha }}
          path: .seo-data
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for prerender
        run: npx puppeteer browsers install chrome

      - name: Get the site content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-content

      - name: Apply plan with Claude
        env:
          # Runs on the claude.ai subscription (token from `claude setup-token`),
          # so usage counts against the plan's limits instead of API billing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          sed "s/{{RUN_DATE}}/$RUN_DATE/g" scripts/seo-agent/prompt.md > "$RUNNER_TEMP/prompt.md"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run lint),Bash(npm run build:site),Bash(npm run build:only),Bash(node scripts/seo-agent/verify.js),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(grep:*)"

      - name: Verify
        run: |
          npm run lint
          npm run build:site
          node scripts/seo-agent/verify.js

      # The edits to tracked and new files (build output, fetched content and .seo-data are ignored) and the two
      # proposal files the prompt asks for, base64 and capped (an environment value over 128 KB can't reach a step)
      - name: Hand over the proposal
        id: handover
        run: |
          git add -A
          hand() {
            local value
            value="$(base64 -w0 < "$2")"
            if [ "${#value}" -gt 100000 ]; then echo "::error::$2 is too large to hand over"; exit 1; fi
            echo "$1=$value" >> "$GITHUB_OUTPUT"
          }
          git diff --cached > "$RUNNER_TEMP/changes.patch"
          hand patch "$RUNNER_TEMP/changes.patch"
          for ext in json md; do
            f=".seo-data/proposals/$RUN_DATE.$ext"
            if [ -f "$f" ]; then hand "proposal-$ext" "$f"; fi
          done

  open-pr:
    needs: [collect, propose]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the PR branch and the proposal on seo-data
      pull-requests: write
    env:
      RUN_DATE: ${{ needs.collect.outputs.run-date }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Everything from propose is untrusted: decoded as data, checked before use, never run
      - name: Take over the proposal
        env:
          PATCH_B64: ${{ needs.propose.outputs.patch }}
          JSON_B64: ${{ needs.propose.outputs.proposal-json }}
          MD_B64: ${{ needs.propose.outputs.proposal-md }}
        run: |
          mkdir -p "$RUNNER_TEMP/proposal"
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/proposal/changes.patch"
          if [ -n "$JSON_B64" ]; then
            printf '%s' "$JSON_B64" | base64 -d > "$RUNNER_TEMP/proposal/proposal.json"
            # evaluate.js reads it every week: a list of changes, each naming a page and an action
            jq -e '(.changes | type == "array") and (.changes | all(type == "object" and (.page | type == "string") and (.action | type == "string")))' \
              "$RUNNER_TEMP/proposal/proposal.json" > /dev/null || { echo "::error::proposal.json has the wrong shape"; exit 1; }
          fi
          if [ -n "$MD_B64" ]; then
            printf '%s' "$MD_B64" | base64 -d > "$RUNNER_TEMP/proposal/proposal.md"
          fi

      # The agent changes only existing files in its places (scripts/seo-agent/config.js, editableFiles: keep `allowed`
      # the same). Anything else stops the run before a PR is opened.
      - name: Check and apply the changes
        run: |
          patch="$RUNNER_TEMP/proposal/changes.patch"
          if [ ! -s "$patch" ]; then echo "No site changes in this proposal."; exit 0; fi
          git apply --index "$patch"
          if [ -n "$(git diff --cached --summary)" ]; then
            echo "::error::The proposal creates, deletes or renames files or changes a file mode:"
            git diff --cached --summary
            exit 1
          fi
          allowed='^(src/i18n/locales/(en|nl)/[A-Za-z0-9_-]+\.ts|src/pages/[A-Za-z0-9_/-]+\.tsx|src/data/(workouts|workoutDetails|workoutDetails\.nl)\.ts|site/routes\.ts|scripts/generate-static-routes\.js)$'
          bad=0
          while IFS=$'\t' read -r status path; do
            if [ "$status" != M ] || ! [[ "$path" =~ $allowed ]]; then
              echo "::error::Not a file the SEO agent may change: $status $path"
              bad=1
            fi
          done < <(git diff --cached --name-status)
          if [ "$(git diff --cached --numstat | awk '$1 == "-" || $2 == "-"' | wc -l)" -ne 0 ]; then
            echo "::error::The proposal changes a binary file"
            bad=1
          fi
          exit "$bad"

      - name: Save proposal
        run: |
          git config user.name "pt7-seo-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin seo-data:refs/remotes/origin/seo-data
          git worktree add -B seo-data .seo-data origin/seo-data
          mkdir -p .seo-data/proposals
          for ext in json md; do
            f="$RUNNER_TEMP/proposal/proposal.$ext"
            if [ -f "$f" ]; then cp "$f" ".seo-data/proposals/$RUN_DATE.$ext"; fi
          done
          code="$(git diff --cached --name-only | grep -v '^src/i18n/locales/' || true)"
          cd .seo-data
          git add proposals
          git diff --cached --quiet || git commit -q -m "proposal: $RUN_DATE"
          git push -q origin seo-data
          {
            if [ -n "$code" ]; then
              echo "> [!WARNING]"
              echo "> Besides translation text, this PR changes code files. Review them as code:"
              printf '> - `%s`\n' $code
              echo
            fi
            # The agent's summary, with @ defused so it can't mention or notify anyone
            if [ -f "proposals/$RUN_DATE.md" ]; then sed 's/@/@\xe2\x80\x8b/g' "proposals/$RUN_DATE.md"; else echo "_The agent wrote no summary._"; fi
            echo; echo "---"; echo
            cat reports/latest.md
            echo; echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: seo-agent/${{ env.RUN_DATE }}
          title: 'SEO agent: week of ${{ env.RUN_DATE }}'
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: |
            SEO agent: weekly changes ${{ env.RUN_DATE }}

            Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          labels: seo
          delete-branch: true
