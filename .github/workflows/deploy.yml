name: Deploy (GitHub Pages and Firebase Hosting)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job asks for what it needs. The build job runs install scripts, so it never gets a sign-in token (id-token):
# on main, such a token could be swapped for the Firebase Hosting deploy account.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # Setup Pages reads the site's settings; no sign-in token here
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No caches in this job: the weekly SEO workflow runs agent-edited code on main's cache scope, so anything
      # restored here could have been written there (seo-weekly.yml)
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Stops the build (and the deploy) on a high or critical advisory in what visitors' browsers run. Build and
      # test tools are left out: Dependabot updates those (owner, 2026-11-18).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # What the build lets through from the database (blog HTML filter, slugs, image names)
      - name: Test the site content rules
        run: npm run content:test

      # The per-login proof the trainee area's session depends on
      - name: Test the trainee session proof
        run: npm run trainee:test

      - name: Install Chrome for prerender
        run: npx puppeteer browsers install chrome

      # Trainers, equipment and blog posts come from the PT7 Academy API with the build key, in this step only (every
      # build needs it; a run without it, such as a pull request from a fork, fails here)
      - name: Fetch site content
        env:
          SITE_BUILD_KEY: ${{ secrets.SITE_BUILD_KEY }}
        run: npm run content

      - name: Build
        timeout-minutes: 12
        run: |
          echo "▶ Build step started"
          npm run build:site
          echo "✅ Build step finished"

      - name: Lighthouse
        timeout-minutes: 15
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")"
          test -x "$CHROME_PATH"
          echo "Chrome: $CHROME_PATH"
          npm run lighthouse

      - name: Lighthouse details (on failure)
        if: failure()
        run: |
          for f in .lighthouseci/lhr-*.json; do
            [ -f "$f" ] || continue
            node -e '
              const r = require(process.argv[1]);
              const a = r.audits;
              console.log(r.configSettings.formFactor, r.finalDisplayedUrl, "CLS", a["cumulative-layout-shift"].numericValue, "LCP", a["largest-contentful-paint"].numericValue);
              for (const i of a["layout-shifts"]?.details?.items ?? []) {
                console.log("  shift", i.score, i.node?.selector, (i.subItems?.items ?? []).map((s) => s.cause).join(", "));
              }
            ' "$PWD/$f"
          done

      # IndexNow (scripts/indexnow.js): the pages this build changes compared with the live pt7.nl, for the indexnow job
      # to send once the deploy is live. It only reads dist and public pages, and never fails the build.
      - name: List the pages this deploy changes (IndexNow)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/indexnow.js changed dist indexnow-urls.txt

      - name: Upload the IndexNow list
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indexnow
          path: indexnow-urls.txt
          retention-days: 7

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      # Since v4 this action leaves out dotfiles; v5 can keep them (include-hidden-files), and pt7.nl needs .well-known/
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          include-hidden-files: true # .well-known/

      # The same build for Firebase Hosting (deploy-firebase below). Only dist: the Hosting config comes from the
      # commit itself, never from this job (it runs install scripts, and firebase.json can hold commands).
      - name: Upload the build for Firebase Hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: ./dist
          include-hidden-files: true # .well-known/
          retention-days: 7

      # The trainee area's own files, for its own Hosting site (academy.pt7.nl)
      - name: Upload the trainee area for Firebase Hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: academy
          path: ./dist-academy
          if-no-files-found: error
          retention-days: 7

  # pt7.nl moves from GitHub Pages to Firebase Hosting (pt7-academy project, milestone 1 step 3). Until the domain moves,
  # every push to main deploys to both: GitHub Pages (pt7.nl) and Firebase Hosting (https://pt7-academy.web.app).
  # Keyless sign-in to GCP (Workload Identity Federation, limited to this repository, main and this file) as an account
  # that may only publish Hosting releases (pt7-academy docs/DEPLOY_GCP.md, "The website on Firebase Hosting").
  # This job holds the token, so it builds nothing and runs no install scripts: firebase.json and the CLI's lockfile
  # come from the commit, the CLI is installed from that lockfile, and only dist comes from the build job. Actions
  # here are pinned to commits.
  deploy-firebase:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the keyless sign-in to GCP, in this job only
    env:
      PROJECT_ID: pt7-academy
      WORKLOAD_IDENTITY_PROVIDER: projects/344238205966/locations/global/workloadIdentityPools/github/providers/website
      DEPLOY_ACCOUNT: website-deploy@pt7-academy.iam.gserviceaccount.com
    steps:
      # Root files (firebase.json among them) and tools/firebase-cli only
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/firebase-cli
          persist-credentials: false

      # firebase-tools runs predeploy/postdeploy entries as shell commands; these configs must never have any, and their
      # hosting section must be inline (not loaded from a file, which could come from dist). The trainee site's config
      # must publish only the trainee files, to its own site.
      - name: Check the Hosting config
        run: |
          node -e '
            const fs = require("fs");
            const hook = (v) => v !== null && typeof v === "object" &&
              Object.entries(v).some(([k, x]) => /^(pre|post)deploy$/.test(k) || hook(x));
            const fail = (message) => { console.error(message); process.exit(1); };
            for (const file of ["firebase.json", "firebase.academy.json"]) {
              const c = JSON.parse(fs.readFileSync(file, "utf8"));
              if (c.hosting === null || typeof c.hosting !== "object" || Array.isArray(c.hosting) || hook(c)) {
                fail(file + ": hosting must be one inline object, without predeploy/postdeploy");
              }
            }
            const academy = JSON.parse(fs.readFileSync("firebase.academy.json", "utf8")).hosting;
            if (academy.site !== "pt7-academy-trainee" || academy.public !== "dist-academy") {
              fail("firebase.academy.json: must publish dist-academy to the site pt7-academy-trainee");
            }'

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ./dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Every dependency fixed by the lockfile (resolved to versions at least two weeks old), no install scripts
      - name: Install the Firebase CLI
        run: |
          npm ci --prefix tools/firebase-cli --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/firebase-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive --message "$GITHUB_SHA"

      # The new release must serve the home page and the API behind it, and no longer the trainee area (it moves to its
      # own address, academy.pt7.nl)
      - name: Check the live site
        shell: bash
        run: |
          set -euo pipefail
          SITE=https://pt7-academy.web.app
          get() { curl -sS --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' "$SITE$1"; }
          test "$(get /)" = 200
          test "$(get /academy/trainee/)" = 404
          test "$(get /.well-known/api-catalog)" = 200
          test "$(get /api/health)" = 200
          echo "ok"

      # The trainee area's own Hosting site. Off until that site exists: the repository variable ACADEMY_HOSTING=on
      # switches these three steps on (pt7-academy docs/DEPLOY_GCP.md, "The trainee area on academy.pt7.nl"). They run
      # after the public site is deployed and checked, so a failure here can't hold it back.
      - name: Download the trainee area
        if: vars.ACADEMY_HOSTING == 'on'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: academy
          path: ./dist-academy

      - name: Deploy the trainee area
        if: vars.ACADEMY_HOSTING == 'on'
        run: firebase deploy --config firebase.academy.json --only hosting --project "$PROJECT_ID" --non-interactive --message "$GITHUB_SHA"

      # Its page must carry the framing ban and no-cache, the API must answer behind it, and none of the public site's
      # pages may be there
      - name: Check the trainee area
        if: vars.ACADEMY_HOSTING == 'on'
        shell: bash
        run: |
          set -euo pipefail
          SITE=https://pt7-academy-trainee.web.app
          get() { curl -sS --retry 3 --retry-all-errors -o /dev/null -D "$RUNNER_TEMP/headers" -w '%{http_code}' "$SITE$1"; }
          has() { tr -d '\r' < "$RUNNER_TEMP/headers" | grep -qi "^$1$"; }
          test "$(get /)" = 200
          has "content-security-policy: frame-ancestors 'none'"
          has "x-frame-options: DENY"
          has "cache-control: no-cache"
          test "$(get /academy/)" = 404
          test "$(get /robots.txt)" = 404
          test "$(get /api/health)" = 200
          has "content-security-policy: default-src 'none'; frame-ancestors 'none'" # the API's own, not the page's
          echo "ok"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # GitHub Pages' own sign-in; this job runs only GitHub's deploy-pages action
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Tells Bing (and the other IndexNow search engines) which pt7.nl pages changed, once GitHub Pages serves them, so
  # they are re-crawled in days. ChatGPT search draws on Bing's index. No secrets, no sign-in and no install scripts:
  # the IndexNow key is public by design (public/<key>.txt). A failure here never affects the deploy.
  # When pt7.nl moves to Firebase Hosting, make this job need deploy-firebase instead of deploy.
  indexnow:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/indexnow.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the IndexNow list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow
          path: .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Send the changed pages to IndexNow
        run: node scripts/indexnow.js submit indexnow-urls.txt
