version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # TypeScript major versions wait until typescript-eslint supports them (TypeScript 7 broke `npm ci` in the
      # grouped pull request #69, 2026-11-18); minor and patch updates still come. Remove when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Firebase CLI for the deploy job (locked; installed without install scripts). Updates wait two weeks.
  - package-ecosystem: "npm"
    directory: "/tools/firebase-cli"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2

  # Lighthouse CI for the build job's Lighthouse step (locked; installed without install scripts). Updates wait two
  # weeks.
  - package-ecosystem: "npm"
    directory: "/tools/lhci"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
